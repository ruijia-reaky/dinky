apiVersion: v1
kind: Namespace
metadata:
  name: dinky-log-agents
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: dinky-log-agent
  namespace: dinky-log-agents
spec:
  selector:
    matchLabels:
      app: dinky-log-agent
  template:
    metadata:
      labels:
        app: dinky-log-agent
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/os: linux
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        supplementalGroups: [9999]
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          # Build and import locally, or replace with your private registry image/digest.
          image: dinky-log-agent:1.3.0
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          env:
            - name: LOG_AGENT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: dinky-log-agent-token
                  key: token
          ports:
            - name: http
              containerPort: 18089
              hostPort: 18090
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: logs
              mountPath: /data/flink-logs
              readOnly: true
      volumes:
        - name: logs
          hostPath:
            path: /data/flink-logs
            type: DirectoryOrCreate
